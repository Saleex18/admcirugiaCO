<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mapa Quirúrgico · Cirugías Autorizadas</title><style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#86868b;--line:#e5e5ea;--accent:#007aff;--danger:#ff3b30;--today:#ff3b30;--soft:#f2f2f7;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a;--accent:#0a84ff;--danger:#ff453a;--today:#ff453a;--soft:#2c2c2e;--shadow:none}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a;--accent:#0a84ff;--danger:#ff453a;--today:#ff453a;--soft:#2c2c2e;--shadow:none}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.app{max-width:1120px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700}
#title{font-size:17px;font-weight:600;color:var(--muted);margin:2px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 14px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.btn{border:0;background:var(--surface);color:var(--text);padding:7px 12px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn.icon{width:34px;padding:6px 0;text-align:center;font-size:16px}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.month-pick{font:inherit;font-weight:500;padding:6px 10px;border-radius:9px;border:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.week{display:grid;grid-template-columns:repeat(6,minmax(132px,1fr));min-width:800px}
.day{border-right:1px solid var(--line);min-height:440px;display:flex;flex-direction:column;cursor:pointer}
.day:last-child{border-right:0}
.day:hover .day-body{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.day-head{padding:12px 10px 10px;text-align:center;border-bottom:1px solid var(--line)}
.dow{display:block;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px;font-weight:600}
.num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:600;margin-top:4px}
.day.today .num{background:var(--today);color:#fff}
.day-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.empty{color:var(--muted);font-size:13px;text-align:center;margin-top:16px}
.ev{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 9px;border-radius:9px;background:var(--soft);border-left:4px solid var(--c,var(--accent));width:100%}
.ev:hover{filter:brightness(.97)}
.ev-time{font-size:12px;font-weight:700;color:var(--c,var(--accent))}
.ev-title{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ev-sub{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.ev-doc{font-size:12px;font-weight:600;color:var(--dc,var(--text))}
.month{display:flex;flex-direction:column}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(6,1fr)}
.mhead div{padding:10px;text-align:center;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.mcell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.mcell:nth-child(6n){border-right:0}
.mcell:hover{background:color-mix(in srgb,var(--soft) 50%,transparent)}
.mcell.other{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.mcell.other .mnum{color:var(--muted)}
.mnum{font-size:13px;font-weight:600;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mcell.today .mnum{background:var(--today);color:#fff}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font-size:11.5px;padding:3px 6px;border-radius:5px;background:var(--soft);border-left:3px solid var(--c,var(--accent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.more{font-size:11px;color:var(--muted);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--surface);color:var(--text);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:18px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 8px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--soft);border-left:4px solid var(--c,var(--accent));width:100%}
.item:hover{filter:brightness(.97)}
.item-time{font-weight:700;font-size:15px;min-width:52px}
.item-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.item-title{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.item-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:var(--c,var(--accent));width:fit-content}
.dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;margin:0 0 18px;font-size:14px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere}
.dl .dc{font-weight:700;color:var(--dc,var(--text))}
@media (max-width:560px){.mcell{min-height:84px}.chip{font-size:10.5px}.row{grid-template-columns:1fr}}

.ev-status{display:inline-block;width:fit-content;margin-top:4px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#e8f5e9;color:#1b5e20}.ev-status.done{background:#e0f2f1;color:#00695c}.ev-chair{font-size:11px;color:var(--muted);font-weight:700}.ev-title,.ev-sub,.ev-doc,.item-title,.item-sub,.dl dd{text-transform:uppercase}.loading{padding:40px 20px;text-align:center;color:var(--muted)}.sync{font-size:11px;color:var(--muted);margin-top:3px}
</style></head><body><div class="app">
<header><div><h1>Mapa Quirúrgico</h1><p id="title"></p><div class="sync" id="sync">Cargando cirugías autorizadas…</div></div>
<div class="controls"><div class="seg"><button data-view="week" onclick="setView('week')">Semana</button><button data-view="month" onclick="setView('month')">Mes</button></div><button class="btn icon" onclick="shift(-1)">‹</button><button class="btn" onclick="goToday()">Hoy</button><button class="btn icon" onclick="shift(1)">›</button><input type="month" class="month-pick" id="jump" onchange="jumpTo(this.value)"></div></header>
<div class="card" id="content"><div class="loading">Cargando programación…</div></div></div>
<div class="overlay" id="detOv" onclick="if(event.target===this)closeOv('detOv')"><div class="modal"><h2>Detalle de la cirugía</h2><p class="sub" id="detSub"></p><dl class="dl" id="detBody"></dl><div class="actions"><span class="grow"></span><button class="btn" onclick="closeOv('detOv')">Cerrar</button></div></div></div><script>const API='https://smizdwogscznptgacyor.supabase.co/functions/v1/cirugias-calendario';
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb"],DIAS_LARGO=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOCENTES={"Dra. Portilla":"#c2185b","Dr. Alpaca":"#1976d2","Dr. Calle":"#2e7d32","Dr. Baldarrago":"#ef6c00","Dr. Arce":"#6a1b9a"};
const TIPOS={"Cirugía Compleja":{short:"Compleja",color:"#7b1fa2",mins:90},"Cirugía Simple":{short:"Simple",color:"#00838f",mins:30}};
let events=[],view="week",cursor=new Date();cursor.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)},esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},mondayOf=d=>{const x=d.getDay();return addDays(d,x===0?-6:1-x)},eventsOn=s=>events.filter(e=>e.fecha===s).sort((a,b)=>a.hora.localeCompare(b.hora)),getEv=id=>events.find(e=>e.id===id),tipoColor=t=>TIPOS[t]?.color||"#007aff",tipoShort=t=>TIPOS[t]?.short||t,docColor=d=>DOCENTES[d]||"#007aff";
const fullDate=s=>{const d=parseISO(s);return `${DIAS_LARGO[(d.getDay()+6)%7]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`};
function toMin(h){const [a,b]=String(h||'00:00').slice(0,5).split(':').map(Number);return a*60+b}function hhmm(m){m=((m%1440)+1440)%1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`}function endTime(e){return hhmm(toMin(e.hora)+(TIPOS[e.tipo]?.mins||0)+(Number(e.extension_minutos)||0))}
function setView(v){view=v;render()}function shift(n){cursor=view==='week'?addDays(cursor,7*n):new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}function goToday(){cursor=new Date();cursor.setHours(0,0,0,0);render()}function jumpTo(v){if(!v)return;const [y,m]=v.split('-').map(Number);cursor=new Date(y,m-1,1);render()}
function rangeLabel(){const m=mondayOf(cursor),s=addDays(m,5);return m.getMonth()===s.getMonth()?`${m.getDate()} – ${s.getDate()} de ${MESES[s.getMonth()]} de ${s.getFullYear()}`:`${m.getDate()} ${MESES[m.getMonth()]} – ${s.getDate()} ${MESES[s.getMonth()]} ${s.getFullYear()}`}function monthLabel(){const m=MESES[cursor.getMonth()];return m[0].toUpperCase()+m.slice(1)+' '+cursor.getFullYear()}
function evCard(e){return `<button class="ev" style="--c:${tipoColor(e.tipo)};--dc:${docColor(e.doctor)}" onclick="event.stopPropagation();openDetail('${e.id}')"><span class="ev-time">${esc(String(e.hora).slice(0,5))}–${esc(endTime(e))} · ${esc(tipoShort(e.tipo))}</span><span class="ev-title">${esc(e.paciente)}</span><span class="ev-sub">EST. ${esc(e.alumno)}</span><span class="ev-doc">${esc(e.doctor)}</span><span class="ev-chair">SILLÓN ${esc(e.sillon)}${e.semestre?` · ${esc(e.semestre)}`:''}</span><span class="ev-status ${e.realizada?'done':''}">${e.realizada?'REALIZADA':'AUTORIZADA'}</span></button>`}
function renderWeek(root){const mon=mondayOf(cursor),today=iso(new Date());let h='<div class="week-wrap"><div class="week">';for(let i=0;i<6;i++){const d=addDays(mon,i),s=iso(d),list=eventsOn(s);h+=`<div class="day ${s===today?'today':''}"><div class="day-head"><span class="dow">${DIAS[i]}</span><span class="num">${d.getDate()}</span></div><div class="day-body">${list.length?list.map(evCard).join(''):'<div class="empty">Sin cirugías</div>'}</div></div>`}root.innerHTML=h+'</div></div>'}
function renderMonth(root){const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=mondayOf(first),today=iso(new Date());let h='<div class="month"><div class="mhead">'+DIAS.map(d=>`<div>${d}</div>`).join('')+'</div><div class="mgrid">';for(let w=0;w<6;w++)for(let i=0;i<6;i++){const d=addDays(start,w*7+i),s=iso(d),other=d.getMonth()!==cursor.getMonth(),list=eventsOn(s),shown=list.slice(0,3);h+=`<div class="mcell ${other?'other':''} ${s===today?'today':''}"><div class="mnum">${d.getDate()}</div>${shown.map(e=>`<button class="chip" style="--c:${tipoColor(e.tipo)}" onclick="openDetail('${e.id}')">${esc(String(e.hora).slice(0,5))} ${esc(e.paciente)}</button>`).join('')}${list.length>3?`<div class="more">+${list.length-3} más</div>`:''}</div>`}root.innerHTML=h+'</div></div>'}
function render(){document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));const r=document.getElementById('content');if(view==='week'){renderWeek(r);document.getElementById('title').textContent=rangeLabel()}else{renderMonth(r);document.getElementById('title').textContent=monthLabel()}document.getElementById('jump').value=`${cursor.getFullYear()}-${pad(cursor.getMonth()+1)}`}
function openOv(id){document.getElementById(id).classList.add('open')}function closeOv(id){document.getElementById(id).classList.remove('open')}function openDetail(id){const e=getEv(id);if(!e)return;document.getElementById('detSub').textContent=fullDate(e.fecha);document.getElementById('detBody').innerHTML=`<dt>Tipo</dt><dd><span class="badge" style="--c:${tipoColor(e.tipo)}">${esc(e.tipo)}</span></dd><dt>Fecha</dt><dd>${esc(fullDate(e.fecha))}</dd><dt>Horario</dt><dd>${esc(String(e.hora).slice(0,5))} – ${esc(endTime(e))}</dd><dt>Docente</dt><dd class="dc" style="--dc:${docColor(e.doctor)}">${esc(e.doctor)}</dd><dt>Sillón</dt><dd>${esc(e.sillon)}</dd><dt>Semestre</dt><dd>${esc(e.semestre||'—')}</dd><dt>Paciente</dt><dd>${esc(e.paciente)}</dd><dt>Estudiante</dt><dd>${esc(e.alumno)}</dd><dt>Estado</dt><dd>${e.realizada?'REALIZADA':'AUTORIZADA'}</dd>`;openOv('detOv')}
async function loadEvents(){try{const r=await fetch(API+'?_t='+Date.now(),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Error');events=(d.items||[]).map(x=>({...x,hora:String(x.hora||'').slice(0,5)}));render();document.getElementById('sync').textContent=`ACTUALIZADO ${new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})} · SOLO CIRUGÍAS AUTORIZADAS`}catch(e){document.getElementById('sync').textContent='SIN CONEXIÓN · REINTENTANDO…'}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv('detOv')});render();loadEvents();setInterval(loadEvents,5000);</script></body></html>
